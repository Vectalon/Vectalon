name: PR leaderboard comment

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    runs-on: ubuntu-latest
    # Only comment on same-repo PRs — fork branches may not carry the committed
    # bench/results and commenting there is noise.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Render leaderboard comment
        run: |
          # The nightly workflow force-commits bench/results/*.json; when they
          # are absent (e.g. before the first nightly run), the CLI exits 1 —
          # skip gracefully instead of failing the PR check.
          if ! node bin/rn-vectalon.js leaderboard bench/results --pr-comment > comment.md 2>/dev/null; then
            echo "No committed leaderboard results yet — nothing to comment"
            rm -f comment.md
            exit 0
          fi

      - name: Upsert leaderboard comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            if (!fs.existsSync('comment.md')) return
            const marker = '<!-- vectalon-leaderboard -->'
            const body = fs.readFileSync('comment.md', 'utf-8')
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
