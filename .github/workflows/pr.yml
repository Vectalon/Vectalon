name: PR Validation

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_pat=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vectalon/core
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all packages
        run: pnpm turbo run typecheck

      - name: Lint all packages
        run: pnpm turbo run lint

      - name: Build all packages
        run: pnpm turbo run build

      - name: Run tests
        run: pnpm turbo run test

      - name: Verify the VS Code extension packages for the Marketplace
        run: |
          cd packages/rn/extension
          npx vsce package --out /tmp/vectalon-check.vsix
          echo "--- files shipped in the .vsix ---"
          npx vsce ls

      - name: Check for uncommitted build artifacts
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Uncommitted changes detected after build. Run 'pnpm build' locally and commit the changes."
            git status --short
            exit 1
          fi
