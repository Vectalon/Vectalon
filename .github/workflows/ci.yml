name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_pat=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vectalon/core
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Lint
        run: pnpm turbo run lint

      - name: Type check
        run: pnpm turbo run typecheck

      - name: Test
        run: pnpm turbo run test

      - name: Extension type check
        run: pnpm --filter @vectalon-dev/rn run typecheck:ext

      - name: Extension lint
        run: pnpm --filter @vectalon-dev/rn run lint:ext

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_pat=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vectalon/core
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@vectalon-dev/rn

      - name: Test with coverage (threshold gate)
        run: pnpm --filter @vectalon-dev/rn run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          files: packages/rn/coverage/coverage-final.json
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_pat=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vectalon/core
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Benchmark deterministic baseline gate
        run: node packages/rn/bin/rn-vectalon.js bench --baseline packages/rn/bench/baseline.json

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: benchmark-results
          path: packages/rn/bench/results/

  # Deploys apps/website (vectalon.in) on every main push, after tests pass.
  # Core source is checked out from the private Vectalon/core repo and rebuilt
  # so the website always bundles the latest core; when CORE_REPO_PAT is unset
  # the committed packages/core/dist is used instead (the site stays
  # deployable either way).
  #
  # Secrets needed (set in the repo settings):
  #   VERCEL_TOKEN       — from https://vercel.com/account/tokens
  #   VERCEL_ORG_ID      — `npx vercel org ls` (or the Team ID in Vercel settings)
  #   VERCEL_PROJECT_ID  — `npx vercel project ls`, or leave unset and the
  #                        action creates the project from `project-name` on
  #                        first deploy. Set ADMIN_PASSWORD in the Vercel
  #                        project's env after the first deploy.
  deploy-website:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Serialize production deploys — a rapid second push must queue, not
    # cancel an in-flight deploy (unlike the workflow-level CI concurrency).
    concurrency:
      group: deploy-website
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "has_pat=false" >> $GITHUB_OUTPUT
            echo "::warning::CORE_REPO_PAT not set — falling back to the committed core dist."
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v4
        with:
          repository: Vectalon/core
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds core first (^build) then the website — catches build errors
      # before they reach the deploy, and regenerates core dist from src when
      # the PAT checkout happened.
      - name: Build core + website
        run: pnpm turbo run build --filter=@vectalon-dev/website

      # Deploy with the official Vercel CLI — the previous
      # `vercel/actions/deploy@v5` reference was a broken action path
      # (vercel/actions has no `deploy` action at v5, and the third-party
      # amondnet/vercel-action doesn't accept `project-name` / `prod-mode`
      # inputs, so the step failed with "Can't find action.yml").
      #
      # The deploy runs from the MONOREPO ROOT (not apps/website): the site
      # depends on `@vectalon-dev/core` via `workspace:*`, which only resolves
      # through the pnpm workspace — a standalone apps/website upload cannot
      # build it. The Vercel project must therefore have its **Root Directory
      # set to `apps/website`** so Vercel installs at the workspace root and
      # builds the Next.js app there, bundling the core dist that this job
      # (re)built above. The CLI reads VERCEL_ORG_ID + VERCEL_PROJECT_ID from
      # the environment and targets the existing `vectalon` project.
      - name: Deploy to Vercel (vectalon.in)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
