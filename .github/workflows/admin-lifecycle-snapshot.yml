name: Admin lifecycle snapshot

on:
  pull_request:
    paths:
      - 'apps/website/lib/admin-lifecycle/**'
      - 'apps/website/contracts/admin/lifecycle/**'
      - 'apps/website/scripts/sync-admin-lifecycle.mjs'
      - '.github/workflows/admin-lifecycle-snapshot.yml'
  push:
    branches: [main]

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vectalon-dev/website check:admin-lifecycle -- --check-snapshot
