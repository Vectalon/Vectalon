name: Publish Packages

on:
  # Auto-publish when pushing to main with [publish-*] tags in commit message
  push:
    branches: [main]
  # Manual fallback via GitHub UI
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - '@vectalon-dev/core'
          - '@vectalon-dev/rn'
          - 'both'

env:
  CI: true

jobs:
  publish-core:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.package == '@vectalon-dev/core' || github.event.inputs.package == 'both'))
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-core]'))
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-both]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@vectalon-dev/core

      - name: Test
        run: pnpm turbo run test --filter=@vectalon-dev/core

      - name: Lint
        run: pnpm turbo run lint --filter=@vectalon-dev/core

      - name: Type check
        run: pnpm turbo run typecheck --filter=@vectalon-dev/core

      - name: Publish @vectalon-dev/core
        run: pnpm publish --filter=@vectalon-dev/core --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-rn:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' &&
       (github.event.inputs.package == '@vectalon-dev/rn' || github.event.inputs.package == 'both'))
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-rn]'))
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-both]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@vectalon-dev/rn

      - name: Test
        run: pnpm turbo run test --filter=@vectalon-dev/rn

      - name: Lint
        run: pnpm turbo run lint --filter=@vectalon-dev/rn

      - name: Type check
        run: pnpm turbo run typecheck --filter=@vectalon-dev/rn

      - name: Publish @vectalon-dev/rn
        run: pnpm publish --filter=@vectalon-dev/rn --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  tag-release:
    runs-on: ubuntu-latest
    needs: [publish-core, publish-rn]
    if: always() && (needs.publish-core.result == 'success' || needs.publish-rn.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          RN_VERSION=$(node -p "require('./packages/rn/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "rn_version=$RN_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=rn-v${RN_VERSION}-core-v${CORE_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}