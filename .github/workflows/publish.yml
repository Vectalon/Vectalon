name: Publish Packages

on:
  # Auto-publish when pushing to main with [publish-*] tags in commit message
  push:
    branches: [main]
  # Manual fallback via GitHub UI
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'both'
        type: choice
        options:
          - '@vectalon-dev/rn'

env:
  CI: true

jobs:
  publish-rn:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.package == '@vectalon-dev/rn')
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-rn]'))
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-both]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout core source (private)
        uses: actions/checkout@v4
        with:
          repository: Vectalon/core
          path: packages/core/src
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@vectalon-dev/rn

      - name: Test
        run: pnpm turbo run test --filter=@vectalon-dev/rn

      - name: Lint
        run: pnpm turbo run lint --filter=@vectalon-dev/rn

      - name: Type check
        run: pnpm turbo run typecheck --filter=@vectalon-dev/rn

      - name: Publish @vectalon-dev/rn
        run: pnpm publish --filter=@vectalon-dev/rn --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  tag-release:
    runs-on: ubuntu-latest
    needs: [publish-rn]
    if: always() && needs.publish-rn.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          RN_VERSION=$(node -p "require('./packages/rn/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "rn_version=$RN_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=rn-v${RN_VERSION}-core-v${CORE_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          ## @vectalon-dev/rn — ${{ steps.version.outputs.rn_version }}

          Core version (bundled): ${{ steps.version.outputs.core_version }}

          ### Install

          ```bash
          npm install @vectalon-dev/rn@${{ steps.version.outputs.rn_version }}
          ```
          EOF
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
