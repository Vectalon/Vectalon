name: Publish Packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: '@vectalon-dev/rn'
        type: choice
        options:
          - '@vectalon-dev/rn'

env:
  CI: true

jobs:
  # P1-11: the release regression gate. Runs the deterministic benchmark
  # against the committed baseline (packages/rn/bench/baseline.json) and fails
  # the release when the per-axis comparison trips (any axis > 1pt drop) or the
  # P1-11 gate trips (relative composite < 0.95, guardrail failed rate up, or
  # adherence down > 5%). The release job below depends on this one.
  bench-gate:
    runs-on: ubuntu-latest
    outputs:
      core-sha: ${{ steps.core-revision.outputs.sha }}
    # Only run for release-triggering pushes / dispatches (same condition as
    # publish-rn) so routine main pushes don't duplicate ci.yml's bench job.
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.package == '@vectalon-dev/rn')
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-rn]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "::error::CORE_REPO_PAT is required for RN releases so the package is always built from the latest Vectalon/core main."
            exit 1
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v5
        with:
          repository: Vectalon/core
          ref: main
          fetch-depth: 1
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Freeze Core release revision
        id: core-revision
        run: |
          CORE_SHA=$(git -C packages/core/src rev-parse HEAD)
          echo "sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "$CORE_SHA" > packages/core/core-source-revision.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate product and pinned Core contracts
        run: pnpm product:check && pnpm contracts:check && node scripts/capability-catalog.mjs check . --base HEAD^
        env:
          CORE_REPO_DIR: packages/core/src

      - name: Build
        run: pnpm turbo run build --filter=@vectalon-dev/rn

      - name: Benchmark regression gate
        run: node packages/rn/bin/rn-vectalon.js bench --baseline packages/rn/bench/baseline.json
        env:
          VECTALON_EXPERIMENTAL: '1'

  publish-rn:
    runs-on: ubuntu-latest
    needs: [bench-gate]
    if: >
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.package == '@vectalon-dev/rn')
      ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-rn]'))
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check for core PAT
        id: pat
        env:
          PAT: ${{ secrets.CORE_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            echo "has_pat=true" >> $GITHUB_OUTPUT
          else
            echo "::error::CORE_REPO_PAT is required for RN releases so the package is always built from the latest Vectalon/core main."
            exit 1
          fi

      - name: Checkout core source (private)
        if: steps.pat.outputs.has_pat == 'true'
        uses: actions/checkout@v5
        with:
          repository: Vectalon/core
          ref: ${{ needs.bench-gate.outputs.core-sha }}
          fetch-depth: 1
          path: packages/core/src
          token: ${{ secrets.CORE_REPO_PAT }}

      - name: Record core revision
        if: steps.pat.outputs.has_pat == 'true'
        run: echo "${{ needs.bench-gate.outputs.core-sha }}" > packages/core/core-source-revision.txt

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm auth
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build --filter=@vectalon-dev/rn

      - name: Validate product and pinned Core contracts
        run: pnpm product:check && pnpm contracts:check && node scripts/capability-catalog.mjs check . --base HEAD^
        env:
          CORE_REPO_DIR: packages/core/src

      - name: Test
        run: pnpm turbo run test --filter=@vectalon-dev/rn

      - name: Lint
        run: pnpm turbo run lint --filter=@vectalon-dev/rn

      - name: Type check
        run: pnpm turbo run typecheck --filter=@vectalon-dev/rn

      - name: Publish @vectalon-dev/rn
        run: pnpm publish --filter=@vectalon-dev/rn --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # A marketplace hiccup (bad token, upload outage) must never fail the
      # release *after* npm already published — the manual vsce-publish
      # workflow is the retry path.
      - name: Publish VS Code extension to the Marketplace
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: node packages/rn/scripts/publish-vsce.js "$(node -p "require('./packages/rn/package.json').version")"

  tag-release:
    runs-on: ubuntu-latest
    needs: [publish-rn]
    if: always() && needs.publish-rn.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          RN_VERSION=$(node -p "require('./packages/rn/package.json').version")
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "rn_version=$RN_VERSION" >> $GITHUB_OUTPUT
          echo "core_version=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "tag=rn-v${RN_VERSION}-core-v${CORE_VERSION}" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build the release body from the released version's CHANGELOG section
      # (see packages/rn/scripts/release-notes.js) so every release ships with
      # real what's-new/breaking-change notes, never a bare template. Falls
      # back to a minimal body pointing at the CHANGELOG when no entry exists.
      - name: Generate release notes from CHANGELOG
        run: node packages/rn/scripts/release-notes.js "${{ steps.version.outputs.rn_version }}" "${{ steps.version.outputs.core_version }}" > /tmp/release-notes.md

      - name: Create GitHub Release
        run: |
          gh release create ${{ steps.version.outputs.tag }} \
            --title "Release ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
